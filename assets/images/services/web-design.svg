<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="glow1" cx="15%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#1D85D0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1D85D0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D85D0"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="skyline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12213A"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#0A0A0B"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glow1)"/>
  <rect width="1200" height="800" fill="url(#glow2)"/>

  <!-- Kenya-made pin badge -->
  <g transform="translate(60,56)" filter="url(#softShadow)">
    <rect width="222" height="46" rx="23" fill="#12141A" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="14" y="15" width="16" height="16" fill="#0A0A0A"/>
    <rect x="30" y="15" width="16" height="16" fill="#C8102E"/>
    <rect x="46" y="15" width="16" height="16" fill="#FFFFFF"/>
    <rect x="62" y="15" width="16" height="16" fill="#006400"/>
    <text x="94" y="28" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#E5EDF8">Designed in Nairobi</text>
  </g>

  <!-- Desktop browser mockup -->
  <g filter="url(#softShadow)">
    <rect x="260" y="150" width="700" height="430" rx="22" fill="#111318" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
    <!-- browser bar -->
    <rect x="260" y="150" width="700" height="44" rx="22" fill="#181B22"/>
    <rect x="260" y="172" width="700" height="22" fill="#181B22"/>
    <circle cx="290" cy="172" r="6" fill="#FF5F57"/>
    <circle cx="312" cy="172" r="6" fill="#FEBC2E"/>
    <circle cx="334" cy="172" r="6" fill="#28C840"/>
    <rect x="470" y="160" width="280" height="24" rx="12" fill="#0A0A0B" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="610" y="177" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8B93A1">xclusivetech.co.ke</text>

    <!-- content area -->
    <rect x="260" y="194" width="700" height="386" fill="url(#skyline)"/>

    <!-- Nairobi skyline silhouette -->
    <g fill="#05070C">
      <rect x="270" y="470" width="40" height="110"/>
      <rect x="316" y="430" width="34" height="150"/>
      <rect x="356" y="500" width="46" height="80"/>
      <!-- KICC-style tower -->
      <rect x="418" y="390" width="30" height="190"/>
      <ellipse cx="433" cy="388" rx="34" ry="10"/>
      <rect x="464" y="450" width="36" height="130"/>
      <rect x="506" y="410" width="30" height="170"/>
      <rect x="542" y="480" width="50" height="100"/>
      <rect x="598" y="440" width="34" height="140"/>
      <rect x="638" y="500" width="40" height="80"/>
      <rect x="684" y="460" width="30" height="120"/>
      <rect x="720" y="420" width="36" height="160"/>
      <rect x="762" y="490" width="44" height="90"/>
      <rect x="812" y="450" width="30" height="130"/>
      <rect x="848" y="500" width="42" height="80"/>
      <rect x="896" y="470" width="34" height="110"/>
    </g>

    <!-- headline -->
    <text x="610" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="url(#textGrad)">Web design that gets</text>
    <text x="610" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#E5EDF8">you found in Kenya</text>

    <!-- CTA button -->
    <rect x="500" y="355" width="220" height="46" rx="10" fill="#FFFFFF"/>
    <text x="610" y="384" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0A0A0B">Get a Free Quote</text>
  </g>

  <!-- Phone mockup -->
  <g filter="url(#softShadow)">
    <rect x="800" y="330" width="200" height="400" rx="34" fill="#111318" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
    <rect x="812" y="350" width="176" height="360" rx="18" fill="url(#skyline)"/>
    <rect x="880" y="338" width="40" height="8" rx="4" fill="#05070C"/>
    <g fill="#05070C">
      <rect x="820" y="620" width="18" height="60"/>
      <rect x="842" y="600" width="16" height="80"/>
      <rect x="864" y="630" width="20" height="50"/>
      <rect x="890" y="590" width="14" height="90"/>
      <rect x="910" y="615" width="18" height="65"/>
      <rect x="934" y="600" width="16" height="80"/>
      <rect x="956" y="625" width="20" height="55"/>
    </g>
    <text x="900" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="url(#textGrad)">Mobile-first,</text>
    <text x="900" y="474" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#E5EDF8">always fast</text>
    <rect x="850" y="500" width="100" height="34" rx="17" fill="#FFFFFF"/>
    <text x="900" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0A0A0B">Get Started</text>
  </g>

  <!-- KES price badge -->
  <g transform="translate(190,300) rotate(-8)" filter="url(#softShadow)">
    <rect width="196" height="60" rx="16" fill="#10B981"/>
    <text x="98" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#06281D">From</text>
    <text x="98" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#06281D">KES 31,500</text>
  </g>

  <!-- WhatsApp badge -->
  <g transform="translate(150,600)" filter="url(#softShadow)">
    <circle cx="34" cy="34" r="34" fill="#25D366"/>
    <path fill="#FFFFFF" transform="translate(16,16) scale(0.75)" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.67-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.076 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/>
  </g>
</svg>
