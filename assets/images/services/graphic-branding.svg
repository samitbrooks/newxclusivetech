<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="brandBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accentPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="floatShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#2563EB" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="800" height="600" fill="#FFFFFF"/>
  <!-- Very subtle grid -->
  <g opacity="0.4">
    <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 0,500 L 800,500" stroke="#F1F5F9" stroke-width="1"/>
    <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" stroke="#F1F5F9" stroke-width="1"/>
  </g>

  <!-- Main Brand Identity Board (Center Card) -->
  <g transform="translate(100, 60)" filter="url(#cardShadow)">
    <rect width="600" height="420" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Top Header Bar -->
    <rect width="600" height="52" rx="20" fill="#F8FAFC"/>
    <rect y="40" width="600" height="12" fill="#F8FAFC"/>
    <line x1="0" y1="52" x2="600" y2="52" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Controls -->
    <circle cx="32" cy="26" r="5" fill="#EF4444"/>
    <circle cx="48" cy="26" r="5" fill="#F59E0B"/>
    <circle cx="64" cy="26" r="5" fill="#10B981"/>
    <text x="300" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Brand Identity &amp; Design System &#8226; Guidelines 2026</text>

    <!-- Logo Construction Grid (Left section) -->
    <g transform="translate(36, 80)">
      <rect width="240" height="190" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
      <!-- Grid crosshairs -->
      <line x1="120" y1="20" x2="120" y2="170" stroke="#CBD5E1" stroke-dasharray="3 3"/>
      <line x1="20" y1="95" x2="220" y2="95" stroke="#CBD5E1" stroke-dasharray="3 3"/>
      <circle cx="120" cy="95" r="50" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 4"/>
      <!-- Vector Logo Emblem -->
      <path d="M 95,70 L 145,120 M 145,70 L 95,120" stroke="url(#brandBlueGrad)" stroke-width="14" stroke-linecap="round"/>
      <circle cx="120" cy="95" r="8" fill="#10B981"/>
      <!-- Vector Anchor Points -->
      <rect x="91" y="66" width="8" height="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
      <rect x="141" y="66" width="8" height="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
      <rect x="91" y="116" width="8" height="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
      <rect x="141" y="116" width="8" height="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="120" y="174" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">Logo Geometry &amp; Proportions</text>
    </g>

    <!-- Color Palette Section (Right Top) -->
    <g transform="translate(300, 80)">
      <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Curated Brand Palette</text>
      <!-- Color Chips -->
      <g transform="translate(0, 30)">
        <!-- Chip 1 -->
        <rect x="0" y="0" width="60" height="70" rx="8" fill="#0F172A" stroke="#E2E8F0"/>
        <text x="30" y="62" font-family="monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">#0F172A</text>
        <!-- Chip 2 -->
        <rect x="68" y="0" width="60" height="70" rx="8" fill="url(#brandBlueGrad)"/>
        <text x="98" y="62" font-family="monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">#2563EB</text>
        <!-- Chip 3 -->
        <rect x="136" y="0" width="60" height="70" rx="8" fill="url(#emeraldGrad)"/>
        <text x="166" y="62" font-family="monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">#10B981</text>
        <!-- Chip 4 -->
        <rect x="204" y="0" width="60" height="70" rx="8" fill="url(#accentPurpleGrad)"/>
        <text x="234" y="62" font-family="monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">#8B5CF6</text>
      </g>
    </g>

    <!-- Typography & Hierarchy (Right Bottom) -->
    <g transform="translate(300, 205)">
      <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Modern Typography Hierarchy</text>
      <g transform="translate(0, 28)">
        <rect width="264" height="65" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="16" y="26" font-family="'Ubuntu', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Ubuntu Bold — Primary Heading</text>
        <text x="16" y="48" font-family="-apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748B">Body text: clean, accessible, mobile-first legibility</text>
      </g>
    </g>

    <!-- Business Card Mockups (Bottom row) -->
    <g transform="translate(36, 290)">
      <!-- Card Front -->
      <g transform="translate(0, 0)" filter="url(#cardShadow)">
        <rect width="180" height="100" rx="10" fill="#0F172A"/>
        <circle cx="34" cy="36" r="14" fill="#2563EB"/>
        <path d="M 28,30 L 40,42 M 40,30 L 28,42" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
        <text x="60" y="35" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">XCLUSIVE</text>
        <text x="60" y="48" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#38BDF8">TECH &#8226; NAIROBI</text>
        <line x1="20" y1="68" x2="160" y2="68" stroke="#334155" stroke-width="0.75"/>
        <text x="20" y="84" font-family="-apple-system, sans-serif" font-size="8" fill="#94A3B8">www.xclusivetech.co.ke</text>
      </g>
      <!-- Card Back -->
      <g transform="translate(200, 0)" filter="url(#cardShadow)">
        <rect width="180" height="100" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Samuel Brooks</text>
        <text x="20" y="46" font-family="-apple-system, sans-serif" font-size="9" font-weight="500" fill="#2563EB">Lead Designer &amp; Developer</text>
        <line x1="20" y1="58" x2="160" y2="58" stroke="#F1F5F9" stroke-width="1"/>
        <text x="20" y="74" font-family="-apple-system, sans-serif" font-size="8" fill="#64748B">+254 722 753 819</text>
        <text x="20" y="88" font-family="-apple-system, sans-serif" font-size="8" fill="#64748B">Kilimani, Nairobi, Kenya</text>
      </g>
      <!-- Brand Guide Tag -->
      <g transform="translate(400, 16)">
        <rect width="128" height="68" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="64" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">&#10003; Complete Assets</text>
        <text x="64" y="50" font-family="-apple-system, sans-serif" font-size="9" fill="#3B82F6" text-anchor="middle">SVG, PNG, PDF, CMYK</text>
      </g>
    </g>
  </g>

  <!-- Floating Badge (Top Right) -->
  <g transform="translate(620, 30)" filter="url(#floatShadow)">
    <rect width="140" height="42" rx="21" fill="#10B981"/>
    <text x="70" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#9733; 100% Vector Ready</text>
  </g>
</svg>
