<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="cloudBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="badgeShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="800" height="480" fill="#FFFFFF"/>
  <g opacity="0.35">
    <path d="M 0,80 L 800,80 M 0,160 L 800,160 M 0,240 L 800,240 M 0,320 L 800,320 M 0,400 L 800,400" stroke="#F1F5F9" stroke-width="1"/>
    <path d="M 80,0 L 80,480 M 160,0 L 160,480 M 240,0 L 240,480 M 320,0 L 320,480 M 400,0 L 400,480 M 480,0 L 480,480 M 560,0 L 560,480 M 640,0 L 640,480 M 720,0 L 720,480" stroke="#F1F5F9" stroke-width="1"/>
  </g>

  <!-- Center Card: High-Performance Infrastructure -->
  <g transform="translate(100, 40)" filter="url(#cardShadow)">
    <rect width="600" height="380" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect width="600" height="52" rx="20" fill="#F8FAFC"/>
    <rect y="40" width="600" height="12" fill="#F8FAFC"/>
    <line x1="0" y1="52" x2="600" y2="52" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="32" cy="26" r="5" fill="#EF4444"/>
    <circle cx="48" cy="26" r="5" fill="#F59E0B"/>
    <circle cx="64" cy="26" r="5" fill="#10B981"/>
    <!-- Domain Search Bar -->
    <rect x="160" y="12" width="320" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="180" cy="26" r="4" fill="#10B981"/>
    <text x="320" y="30" font-family="monospace" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">https://yourbusiness.co.ke &#8226; [SSL SECURE]</text>

    <!-- Cloud Server Rack Unit (Left) -->
    <g transform="translate(36, 80)">
      <rect width="250" height="260" rx="14" fill="#0F172A"/>
      <!-- Server 1 -->
      <g transform="translate(16, 18)">
        <rect width="218" height="54" rx="8" fill="#1E293B" stroke="#334155"/>
        <circle cx="16" cy="27" r="4" fill="#10B981"/>
        <circle cx="28" cy="27" r="4" fill="#10B981"/>
        <circle cx="40" cy="27" r="4" fill="#38BDF8"/>
        <text x="56" y="24" font-family="monospace" font-size="10" font-weight="700" fill="#FFFFFF">NVMe Cloud Server #01</text>
        <text x="56" y="38" font-family="monospace" font-size="8" fill="#94A3B8">Nairobi DC &#8226; Ultra-low Latency</text>
      </g>
      <!-- Server 2 -->
      <g transform="translate(16, 82)">
        <rect width="218" height="54" rx="8" fill="#1E293B" stroke="#334155"/>
        <circle cx="16" cy="27" r="4" fill="#10B981"/>
        <circle cx="28" cy="27" r="4" fill="#10B981"/>
        <circle cx="40" cy="27" r="4" fill="#10B981"/>
        <text x="56" y="24" font-family="monospace" font-size="10" font-weight="700" fill="#FFFFFF">High-Speed SSD Storage</text>
        <text x="56" y="38" font-family="monospace" font-size="8" fill="#94A3B8">Automatic Daily Backups</text>
      </g>
      <!-- Server 3 -->
      <g transform="translate(16, 146)">
        <rect width="218" height="54" rx="8" fill="#1E293B" stroke="#334155"/>
        <circle cx="16" cy="27" r="4" fill="#10B981"/>
        <circle cx="28" cy="27" r="4" fill="#38BDF8"/>
        <circle cx="40" cy="27" r="4" fill="#10B981"/>
        <text x="56" y="24" font-family="monospace" font-size="10" font-weight="700" fill="#FFFFFF">Free SSL &#8226; DDoS Shield</text>
        <text x="56" y="38" font-family="monospace" font-size="8" fill="#94A3B8">Enterprise Hardware Firewall</text>
      </g>
      <!-- Metric bar -->
      <g transform="translate(16, 212)">
        <rect width="218" height="32" rx="6" fill="#111827"/>
        <text x="109" y="21" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">&#10003; 99.9% Uptime SLA Guaranteed</text>
      </g>
    </g>

    <!-- Domain Registrations Hub (Right) -->
    <g transform="translate(316, 80)">
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0F172A">Kenyan &amp; Global Domain Registry</text>
      <text x="0" y="36" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B">Fast instant DNS setup, no technical hassle.</text>

      <!-- Domain Extensions Grid -->
      <g transform="translate(0, 54)">
        <!-- .co.ke -->
        <rect width="120" height="54" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="60" y="26" font-family="monospace" font-size="14" font-weight="800" fill="#1D4ED8" text-anchor="middle">.co.ke</text>
        <text x="60" y="42" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#3B82F6" text-anchor="middle">KES 1,500/yr</text>
        <!-- .com -->
        <g transform="translate(132, 0)">
          <rect width="120" height="54" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
          <text x="60" y="26" font-family="monospace" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">.com</text>
          <text x="60" y="42" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">KES 1,800/yr</text>
        </g>
        <!-- .org -->
        <g transform="translate(0, 64)">
          <rect width="120" height="54" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
          <text x="60" y="26" font-family="monospace" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">.org</text>
          <text x="60" y="42" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">KES 2,000/yr</text>
        </g>
        <!-- .africa -->
        <g transform="translate(132, 64)">
          <rect width="120" height="54" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
          <text x="60" y="26" font-family="monospace" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">.africa</text>
          <text x="60" y="42" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">KES 2,500/yr</text>
        </g>
      </g>

      <!-- Kenyan Business Benefit Box -->
      <g transform="translate(0, 190)">
        <rect width="252" height="66" rx="10" fill="#F0FDF4" stroke="#BBF7D0"/>
        <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#15803D">&#10003; KeNIC Accredited Setup</text>
        <text x="16" y="42" font-family="-apple-system, sans-serif" font-size="10" fill="#166534">Includes business email configuration</text>
        <text x="16" y="56" font-family="-apple-system, sans-serif" font-size="10" fill="#166534">(e.g. info@yourbusiness.co.ke)</text>
      </g>
    </g>
  </g>
</svg>
